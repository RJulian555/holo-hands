<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holo Hands — 3D Hologram Lab + Solar Eclipse Shader</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Hidden raw video element used as source for MediaPipe and WebGL Shader -->
      <video id="webcam" autoplay playsinline muted></video>

      <!-- Layer 1 (Background): Full-screen WebGL Webcam + Optional Sun / Eclipse / God-Ray Shader -->
      <div id="bg-shader-container"></div>

      <!-- Layer 2 (Middle): Full-screen 3D Holographic Shapes WebGL Canvas -->
      <div id="three-container"></div>

      <!-- Layer 3 (Foreground): 2D Overlay Canvas for Glowing Hand Skeleton, Reticles & Beams -->
      <canvas id="output-canvas"></canvas>

      <!-- Sleek Top Iron Man Hologram Status Bar -->
      <header id="top-bar" aria-label="Hologram Lab Status Bar">
        <div class="top-bar-brand">STARK // HOLO-LAB MK.V</div>
        <div class="top-bar-metrics">
          <div class="metric-pill">
            <span class="metric-dot" id="hands-dot"></span>
            <span id="hands-count">Hands Detected: 0/2</span>
          </div>
          <div class="metric-pill">
            <span class="metric-dot active-dot"></span>
            <span id="shapes-count">Active Shapes: 1</span>
          </div>
          <div class="metric-pill" id="sun-status-pill">
            <span class="metric-dot" id="sun-dot"></span>
            <span id="sun-status-text">Sun: OFF</span>
          </div>
        </div>
        <button id="clear-all-btn" type="button">
          <span class="clear-icon">✕</span>
          <span>Clear All</span>
        </button>
      </header>

      <!-- Compact Top-Left Holographic Toggle Menu + SUN Toggle Button -->
      <aside id="hud-menu" aria-label="Shape Spawner Menu">
        <div class="hud-top-controls">
          <button id="shapes-toggle-btn" type="button" aria-expanded="false">
            <span class="toggle-icon">+</span>
            <span class="toggle-label">SHAPES</span>
          </button>

          <button id="sun-toggle-btn" type="button" aria-pressed="false">
            <span class="sun-icon">☀</span>
            <span class="sun-label">SUN</span>
          </button>
        </div>

        <div id="shapes-drawer" aria-hidden="true">
          <button class="hud-btn" data-shape="cube" type="button">
            <span class="hud-icon">◇</span>
            <span class="hud-label">Cube</span>
          </button>
          <button class="hud-btn" data-shape="sphere" type="button">
            <span class="hud-icon">◯</span>
            <span class="hud-label">Sphere</span>
          </button>
          <button class="hud-btn" data-shape="pyramid" type="button">
            <span class="hud-icon">△</span>
            <span class="hud-label">Pyramid</span>
          </button>
          <button class="hud-btn" data-shape="ring" type="button">
            <span class="hud-icon">◎</span>
            <span class="hud-label">Ring</span>
          </button>
        </div>
      </aside>

      <!-- Temporary Holographic Merge Label -->
      <div id="combine-banner" aria-live="polite"></div>

      <!-- Bottom-Left Holographic Trash Drop Zone -->
      <div id="trash-zone" aria-label="Trash Drop Zone">
        <div class="trash-ring">
          <svg
            class="trash-svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 6h18" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <line x1="10" y1="11" x2="10" y2="17" />
            <line x1="14" y1="11" x2="14" y2="17" />
          </svg>
        </div>
        <div class="trash-label" id="trash-label">TRASH</div>
      </div>

      <div id="status-badge">Initializing MediaPipe Hands & Selfie Segmenter...</div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
